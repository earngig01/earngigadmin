
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102A56">
<title>AHRUH | Notifications</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#102A56;
  --royal:#1768D5;
  --gold:#D6B66F;
  --pale:#F4F8FF;
  --light:#EAF2FF;
  --white:#fff;
  --text:#243653;
  --muted:#8996AA;
  --line:#E8EDF5;
  --green:#16865E;
  --red:#C64F54;
  --shadow:0 5px 18px rgba(35,76,140,.07);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--pale);
  color:var(--text);
  font-family:'DM Sans',Arial,sans-serif;
  font-size:13px;
}
button,input,select{font:inherit}
a{text-decoration:none;color:inherit}
.topbar{
  background:var(--navy);
  color:white;
  padding:13px 17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
}
.brand-name{
  font-family:'Cormorant Garamond',serif;
  font-size:32px;
  font-weight:700;
  letter-spacing:2px;
  line-height:1;
}
.brand-tag{
  font-size:8px;
  letter-spacing:2px;
  color:#D6E5FA;
  margin-top:5px;
}
.back{
  color:white;
  background:#ffffff20;
  border:0;
  border-radius:20px;
  padding:9px 13px;
  font-size:11px;
}
.main{
  max-width:850px;
  margin:auto;
  padding:20px 15px 100px;
}
.heading{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:17px;
}
.heading h1{
  color:var(--navy);
  font-size:23px;
  margin:0 0 5px;
}
.heading p{
  color:var(--muted);
  font-size:11px;
  margin:0;
  line-height:1.5;
}
.unread-count{
  background:var(--light);
  color:var(--royal);
  padding:7px 10px;
  border-radius:20px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}
.summary{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-bottom:17px;
}
.summary-card{
  background:white;
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px;
  box-shadow:var(--shadow);
}
.summary-card small{
  color:var(--muted);
  font-size:10px;
}
.summary-card strong{
  display:block;
  color:var(--navy);
  font-size:22px;
  margin-top:7px;
}
.toolbar{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
.search{
  flex:1;
  min-width:0;
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px;
  background:white;
  outline:none;
  font-size:11px;
}
.search:focus{border-color:#8BB8F4}
.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:8px;
  scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.filter{
  flex:none;
  border:1px solid var(--line);
  border-radius:20px;
  padding:8px 12px;
  background:white;
  color:var(--text);
  font-size:10px;
}
.filter.active{
  background:var(--navy);
  border-color:var(--navy);
  color:white;
}
.actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin:10px 0 13px;
}
.actions button{
  border:0;
  background:transparent;
  color:var(--royal);
  font-size:10px;
  font-weight:800;
  padding:7px 0;
}
.notification-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}
.notification{
  background:white;
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px;
  display:flex;
  align-items:flex-start;
  gap:11px;
  box-shadow:var(--shadow);
}
.notification.unread{
  border-left:3px solid var(--royal);
  background:#FCFDFF;
}
.n-icon{
  width:39px;
  height:39px;
  flex:none;
  border-radius:12px;
  background:var(--light);
  color:var(--royal);
  display:grid;
  place-items:center;
  font-size:19px;
}
.n-content{flex:1;min-width:0}
.n-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
}
.n-top strong{
  color:var(--navy);
  font-size:11px;
  line-height:1.5;
}
.n-time{
  color:var(--muted);
  font-size:9px;
  white-space:nowrap;
}
.n-content p{
  color:#64748B;
  font-size:10px;
  line-height:1.6;
  margin:5px 0 8px;
}
.n-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.n-type{
  color:var(--royal);
  background:var(--light);
  border-radius:20px;
  padding:4px 8px;
  font-size:8px;
  font-weight:700;
}
.n-buttons{display:flex;gap:10px}
.n-buttons button{
  border:0;
  background:none;
  padding:3px 0;
  color:var(--royal);
  font-size:9px;
  font-weight:800;
}
.n-buttons button.delete{color:var(--red)}
.empty{
  text-align:center;
  padding:35px 15px;
  background:white;
  border:1px solid var(--line);
  border-radius:13px;
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
}
.empty-icon{
  font-size:29px;
  margin-bottom:9px;
}
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:white;
  border-top:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-around;
  z-index:10;
}
.bottom-nav a{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  color:var(--muted);
  font-size:9px;
}
.bottom-nav span{font-size:19px}
.bottom-nav a.active{color:var(--royal);font-weight:800}
@media(min-width:650px){
  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:380px){
  .n-time{font-size:8px}
  .notification{padding:11px}
  .n-icon{width:34px;height:34px}
}
</style>
</head>

<body>

<header class="topbar">
  <div>
    <div class="brand-name">AHRUH</div>
    <div class="brand-tag">ADMIN SPACE</div>
  </div>
  <a class="back" href="admin.html">← Dashboard</a>
</header>

<main class="main">

  <div class="heading">
    <div>
      <h1>Notifications</h1>
      <p>Stay informed about activity and updates across AHRUH.</p>
    </div>
    <div class="unread-count" id="unreadBadge">0 unread</div>
  </div>

  <div class="summary">
    <div class="summary-card">
      <small>Total notifications</small>
      <strong id="totalCount">0</strong>
    </div>
    <div class="summary-card">
      <small>Unread notifications</small>
      <strong id="unreadCount">0</strong>
    </div>
  </div>

  <div class="toolbar">
    <input
      class="search"
      id="searchInput"
      type="search"
      placeholder="Search notifications..."
      oninput="renderNotifications()"
    >
  </div>

  <div class="filters">
    <button class="filter active" onclick="setFilter('all',this)">All</button>
    <button class="filter" onclick="setFilter('unread',this)">Unread</button>
    <button class="filter" onclick="setFilter('orders',this)">Orders</button>
    <button class="filter" onclick="setFilter('batches',this)">Batches</button>
    <button class="filter" onclick="setFilter('customers',this)">Customers</button>
    <button class="filter" onclick="setFilter('payments',this)">Payments</button>
    <button class="filter" onclick="setFilter('rewards',this)">Rewards</button>
    <button class="filter" onclick="setFilter('system',this)">System</button>
  </div>

  <div class="actions">
    <button onclick="markAllRead()">Mark all as read</button>
    <button onclick="clearRead()">Clear read notifications</button>
  </div>

  <div class="notification-list" id="notificationList"></div>

</main>

<nav class="bottom-nav">
  <a href="admin.html"><span>⌂</span>Home</a>
  <a href="batches.html"><span>▦</span>Batches</a>
  <a href="orders.html"><span>🛍</span>Orders</a>
  <a href="products.html"><span>◇</span>Products</a>
  <a class="active" href="notifications.html"><span>♧</span>Alerts</a>
</nav>

<script>
const STORAGE_KEY="ahruh_admin_notifications_prototype_v1";

let notifications=[];
let activeFilter="all";

function loadNotifications(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
    notifications=Array.isArray(saved)?saved:[];
  }catch(error){
    notifications=[];
  }
}

function saveNotifications(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(notifications));
  }catch(error){
    alert("Unable to save notifications in this browser.");
  }
}

function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,char=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[char]));
}

function iconFor(type){
  const icons={
    orders:"🛍",
    batches:"▱",
    customers:"♙",
    payments:"₦",
    rewards:"✧",
    system:"⚙"
  };
  return icons[type]||"♧";
}

function formatTime(value){
  if(!value)return "Date unavailable";

  const date=new Date(value);
  if(isNaN(date.getTime()))return "Date unavailable";

  return date.toLocaleString("en-NG",{
    day:"numeric",
    month:"short",
    hour:"numeric",
    minute:"2-digit"
  });
}

function setFilter(filter,button){
  activeFilter=filter;

  document.querySelectorAll(".filter").forEach(item=>
    item.classList.remove("active")
  );

  button.classList.add("active");
  renderNotifications();
}

function getVisibleNotifications(){
  const search=document.getElementById("searchInput").value
    .trim().toLowerCase();

  return notifications
    .filter(item=>{
      if(activeFilter==="unread"&&item.read)return false;
      if(activeFilter!=="all"&&activeFilter!=="unread"&&item.type!==activeFilter)return false;

      const text=[
        item.title,
        item.message,
        item.type
      ].join(" ").toLowerCase();

      return !search||text.includes(search);
    })
    .sort((a,b)=>
      new Date(b.createdAt||0)-new Date(a.createdAt||0)
    );
}

function renderNotifications(){
  const list=document.getElementById("notificationList");
  const unread=notifications.filter(item=>!item.read).length;

  document.getElementById("totalCount").textContent=notifications.length;
  document.getElementById("unreadCount").textContent=unread;
  document.getElementById("unreadBadge").textContent=unread+" unread";

  const visible=getVisibleNotifications();

  if(!visible.length){
    list.innerHTML=`
      <div class="empty">
        <div class="empty-icon">♧</div>
        <strong>No notifications found</strong><br>
        New AHRUH activity notifications will appear here when connected.
      </div>`;
    return;
  }

  list.innerHTML=visible.map(item=>`
    <article class="notification ${item.read?"":"unread"}">
      <div class="n-icon">${iconFor(item.type)}</div>

      <div class="n-content">
        <div class="n-top">
          <strong>${escapeHTML(item.title||"Notification")}</strong>
          <span class="n-time">${formatTime(item.createdAt)}</span>
        </div>

        <p>${escapeHTML(item.message||"")}</p>

        <div class="n-bottom">
          <span class="n-type">${escapeHTML(item.type||"system")}</span>

          <div class="n-buttons">
            ${item.read
              ?`<button onclick="markUnread('${item.id}')">Mark unread</button>`
              :`<button onclick="markRead('${item.id}')">Mark read</button>`
            }
            <button class="delete" onclick="deleteNotification('${item.id}')">Delete</button>
          </div>
        </div>
      </div>
    </article>
  `).join("");
}

function markRead(id){
  const item=notifications.find(item=>String(item.id)===String(id));
  if(!item)return;
  item.read=true;
  saveNotifications();
  renderNotifications();
}

function markUnread(id){
  const item=notifications.find(item=>String(item.id)===String(id));
  if(!item)return;
  item.read=false;
  saveNotifications();
  renderNotifications();
}

function markAllRead(){
  notifications.forEach(item=>item.read=true);
  saveNotifications();
  renderNotifications();
}

function deleteNotification(id){
  if(!confirm("Delete this notification?"))return;

  notifications=notifications.filter(item=>
    String(item.id)!==String(id)
  );

  saveNotifications();
  renderNotifications();
}

function clearRead(){
  const readCount=notifications.filter(item=>item.read).length;

  if(!readCount){
    alert("There are no read notifications to clear.");
    return;
  }

  if(!confirm("Clear all read notifications?"))return;

  notifications=notifications.filter(item=>!item.read);
  saveNotifications();
  renderNotifications();
}

loadNotifications();
renderNotifications();
</script>

</body>
</html>
